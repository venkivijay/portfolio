<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="Venki Vijay" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="any" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="alternate" type="application/rss+xml" title="Venki Vijay's Blog" href="/feed.xml" />
    <link rel="alternate" type="application/rss+xml" title="Venki Vijay's Blog (English)" href="/feed.en.xml" />
    <link rel="alternate" type="application/rss+xml" title="Venki Vijay's Blog (தமிழ்)" href="/feed.ta.xml" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)" />
    <meta name="msapplication-TileColor" content="#ffffff" />
    <title>Venki Vijay</title>
    <!--
      Critical theme colours, inlined by hand.

      The build inlines above-the-fold CSS so the first paint is styled, but it
      extracts those rules by matching selectors against the prerendered HTML —
      which never carries the `dark` class, since that is applied by the script
      below from localStorage. Every `.dark` rule is therefore dropped from the
      critical CSS, and a dark-mode visitor got a full white flash before the
      real stylesheet arrived.

      These few declarations out-specify the utility classes they correct
      (`html.dark body` beats `.text-gray-700`), so ordering does not matter.
    -->
    <style>
      :root {
        --c-bg: #fff;
      }
      html.dark {
        --c-bg: #050505;
      }
      html {
        background-color: var(--c-bg);
      }
      html.dark body {
        color: #e5e7eb;
      }
      /* Mirrors the block in markdown.css; without it headings and bold text
         paint near-black on the dark background until the stylesheet lands. */
      html.dark .prose {
        --fg-light: #888;
        --fg: #bbb;
        --fg-deep: #ddd;
        --fg-deeper: #fff;
      }
      /* The critical CSS only covers the initial viewport, so rules for
         anything below the fold are left out — including this one. It is the
         text alternative for the 3D skill cloud, so without it the whole
         43-item list renders as visible body copy until the stylesheet loads. */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      }
    </style>
    <script>
      ;(function () {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        const setting = localStorage.getItem('vueuse-color-scheme') || 'auto'
        if (setting === 'dark' || (prefersDark && setting !== 'light'))
          document.documentElement.classList.toggle('dark', true)
      })()
    </script>
  </head>
  <body class="font-sans text-gray-700 dark:text-gray-200 relative">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
